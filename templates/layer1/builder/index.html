<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="builder-token" content="__BUILDER_TOKEN__" />
  <title>Factory Builder</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; display: flex;
           flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; border-bottom: 1px solid #8884; font-weight: 600; }
    #log { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { max-width: 70ch; margin: 8px 0; padding: 10px 14px; border-radius: 12px; }
    .me { margin-left: auto; background: #3b82f6; color: #fff; }
    .bot { background: #8881; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #8884; }
    input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #8886; }
    button { padding: 10px 16px; border-radius: 10px; border: 0; background: #3b82f6;
             color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>Describe what you want — the factory will build it.</header>
  <div id="log"></div>
  <form id="f">
    <input id="i" autocomplete="off" placeholder="e.g. Add a priority field to tasks" />
    <button id="b">Send</button>
  </form>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('f');
    const input = document.getElementById('i');
    const btn = document.getElementById('b');
    const TOKEN = document.querySelector('meta[name="builder-token"]').content;
    function add(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;
      add(prompt, 'me');
      input.value = '';
      btn.disabled = true;
      add('Working on it…', 'bot');
      const thinking = log.lastChild;
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Builder-Token': TOKEN },
          body: JSON.stringify({ prompt }),
        });
        if (res.status === 409) { thinking.textContent =
          "I'm still working on the last request — one moment, then try again."; return; }
        const data = await res.json();
        thinking.textContent = data.reply || 'Done.';
      } catch (err) {
        thinking.textContent = 'Network error — try again.';
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
